  <rect x="28" y="28" width="904" height="544" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="60" y="82" fill="#d1d5db" font-family="Consolas, monospace" font-size="28">Windows PowerShell</text>
