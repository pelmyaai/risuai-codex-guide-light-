<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-label="ChatGPT 보안 설정에서 Codex용 장치 코드 인증을 활성화하는 화면">
  <rect width="920" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="220" height="440" fill="#f7f7f8"/>
  <rect x="8" y="22" width="205" height="48" rx="12" fill="#ececec"/>
  <text x="52" y="53" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700">보안</text>
  <text x="52" y="112" fill="#111827" font-family="Arial, sans-serif" font-size="22">자녀 보호</text>
  <text x="52" y="166" fill="#111827" font-family="Arial, sans-serif" font-size="22">계정</text>
  <text x="255" y="82" fill="#111827" font-family="Arial, sans-serif" font-size="26" font-weight="700">ChatGPT로 보안 로그인</text>
  <text x="255" y="114" fill="#6b7280" font-family="Arial, sans-serif" font-size="17">ChatGPT의 든든한 보안으로, 인터넷의 웹사이트 및 앱에 로그인하세요.</text>
  <text x="255" y="136" fill="#6b7280" font-family="Arial, sans-serif" font-size="17" text-decoration="underline">자세히 알아보기</text>
  <line x1="255" y1="160" x2="860" y2="160" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="275" cy="202" r="15" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="315" y="200" fill="#111827" font-family="Arial, sans-serif" font-size="21">Codex CLI</text>
  <text x="315" y="226" fill="#6b7280" font-family="Arial, sans-serif" font-size="17">Codex CLI가 API 모델을 사용하도록 허용합니다.</text>
  <rect x="760" y="184" width="95" height="38" rx="19" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="784" y="209" fill="#ef4444" font-family="Arial, sans-serif" font-size="17" font-weight="700">연결 해제</text>
  <text x="255" y="300" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700">Codex용 장치 코드 인증 활성화</text>
  <text x="255" y="330" fill="#6b7280" font-family="Arial, sans-serif" font-size="17">일반 브라우저 플로우를 사용할 수 없는 경우 헤드</text>
  <text x="255" y="354" fill="#6b7280" font-family="Arial, sans-serif" font-size="17">리스 또는 원격 환경에 장치 코드 로그인을 사용합니</text>
  <text x="255" y="378" fill="#6b7280" font-family="Arial, sans-serif" font-size="17">다. 장치 코드는 피싱 공격을 당할 수 있으므로 활성</text>
  <text x="255" y="402" fill="#6b7280" font-family="Arial, sans-serif" font-size="17">화 시 주의하십시오. 장치 코드는 결코 공유하지 마세요.</text>
  <rect x="815" y="326" width="44" height="28" rx="14" fill="#1683f5"/>
  <circle cx="845" cy="340" r="11" fill="#ffffff"/>
</svg>
